name: publish-apt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable LaTeX Renderer Stable tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Verify latest immutable Stable release and source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          repo=n624-dev/latex-renderer
          gh api "repos/$repo/releases/latest" |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .immutable and (.draft == false) and (.prerelease == false)'
          commit=$(gh api "repos/$repo/commits/$RELEASE_TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          asset="latex-renderer-server-${RELEASE_TAG#v}.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo "$repo" \
            --signer-workflow "$repo/.github/workflows/server-release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$commit" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: n624-dev/latex-renderer
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
      - name: Build and install the client package
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          corepack enable
          pnpm install --frozen-lockfile
          node client/build-client.mjs
          node deploy/apt/build-package.mjs "$ARCHITECTURE" packages-out
          deb="packages-out/n624-latex_${RELEASE_TAG#v}_$ARCHITECTURE.deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$ARCHITECTURE"
          test "$(dpkg-deb -f "$deb" Package)" = n624-latex
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "./$deb"
          test ! -e /opt/latex-renderer
          test ! -e /etc/latex-renderer
          test "$(/usr/bin/n624-latex --version)" = "${RELEASE_TAG#v}"
          test "$(/usr/bin/latex-render --version)" = "${RELEASE_TAG#v}"
          /usr/bin/n624-latex admin update status --help
          sudo /usr/bin/n624-latex server setup --plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-renderer-apt-${{ matrix.arch }}
          path: packages-out/*.deb
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sign:
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: latex-renderer-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: site-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: n624-dev/latex-renderer
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
          path: latex-renderer-source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: latex-renderer-apt-*
          merge-multiple: true
          path: packages-out
          digest-mismatch: error
      - name: Sign and verify the LaTeX Renderer repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          N624_APT_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gh api repos/n624-dev/latex-renderer/releases/latest |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .immutable and (.draft == false) and (.prerelease == false)'
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils
          test -n "$APT_SIGNING_KEY" && test -n "$N624_APT_FINGERPRINT"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent; rm -r -- "$GNUPGHOME"' EXIT
          chmod 0700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          mkdir apt-site
          cp site-source/index.html apt-site/
          node latex-renderer-source/deploy/apt/build-repository.mjs \
            packages-out apt-site/latex-renderer https://apt.n624.jp/latex-renderer
          gpg --batch --export "$N624_APT_FINGERPRINT" > "$GNUPGHOME/public.gpg"
          gpgv --keyring "$GNUPGHOME/public.gpg" apt-site/latex-renderer/dists/stable/InRelease
          test -z "$(find apt-site \( -type l -o \( -type f -links +1 \) \) -print -quit)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt-site

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
